name: Build, test, attest, and release Windows viewer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-viewer-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'celdevelopment/ciscoipphone-remote-control' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up test Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pinned application and scan tools
        run: |
          python -m pip install -r viewer-requirements.txt bandit==1.9.4 pip-audit==2.10.1 ruff==0.4.3
          if ($LASTEXITCODE) { throw 'Dependency installation failed' }
      - name: Fetch official bundle inputs
        run: |
          New-Item -ItemType Directory -Path downloads,evidence,out | Out-Null
          Copy-Item release/evidence/* evidence/
          Invoke-WebRequest https://www.python.org/ftp/python/3.14.10/python-3.14.10-embed-amd64.zip -OutFile downloads/python-3.14.10-embed-amd64.zip
          python -m pip download --only-binary=:all: --platform win_amd64 --python-version 3.14 --implementation cp --abi cp314 --no-deps --dest downloads -r viewer-requirements.txt
          if ($LASTEXITCODE) { throw 'Windows wheel download failed' }
      - name: Test source and scan application
        run: |
          python -m unittest discover -s tests -v *> evidence/windows-source-tests.txt
          if ($LASTEXITCODE) { Get-Content evidence/windows-source-tests.txt; throw 'Source tests failed' }
          python -m ruff check remote_viewer.py windows tests
          if ($LASTEXITCODE) { throw 'Lint failed' }
          python -m bandit remote_viewer.py windows/install_windows.py windows/build_bundle.py -f json -o evidence/bandit-release.json
          if ($LASTEXITCODE) { throw 'Static scan failed' }
          python -m pip_audit --disable-pip --no-deps -r viewer-requirements.txt -f json -o evidence/viewer-dependency-audit.json
          if ($LASTEXITCODE) { throw 'Dependency scan failed' }
      - name: Build checksum-verified offline ZIP
        run: |
          python windows/build_bundle.py --runtime downloads/python-3.14.10-embed-amd64.zip --wheels downloads --evidence evidence --report release/SECURITY-REVIEW.md --output out/CiscoPhoneViewer-1.0.0-Windows11-x64.zip
          if ($LASTEXITCODE) { throw 'Bundle build failed' }
          Copy-Item release/SECURITY-REVIEW.md out/SECURITY-REVIEW.md
      - name: Test the actual bundled Windows interpreter and package
        run: |
          Expand-Archive out/CiscoPhoneViewer-1.0.0-Windows11-x64.zip smoke
          Push-Location smoke/CiscoPhoneViewer-1.0.0-Windows-x64
          try {
            & ./runtime/python.exe -I -B -c "from pathlib import Path; from install_windows import verify; verify(Path.cwd()); print('Package manifest verified')"
            if ($LASTEXITCODE) { throw 'Package integrity failed' }
            & ./runtime/python.exe -I -B -m unittest discover -s tests -v *> ../../out/windows-bundled-selftest.txt
            if ($LASTEXITCODE) { Get-Content ../../out/windows-bundled-selftest.txt; throw 'Bundled Windows runtime tests failed' }
          } finally { Pop-Location }
      - name: Sign build provenance with GitHub and Sigstore
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/CiscoPhoneViewer-1.0.0-Windows11-x64.zip
      - name: Verify provenance and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          Copy-Item $env:ATTESTATION_BUNDLE out/CiscoPhoneViewer-1.0.0-Windows11-x64.zip.sigstore.json
          gh attestation verify out/CiscoPhoneViewer-1.0.0-Windows11-x64.zip --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { throw 'Provenance verification failed' }
          gh release create viewer-v1.0.0 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Cisco Phone Viewer 1.0.0 for Windows 11 x64' --notes-file release/RELEASE-NOTES.md out/CiscoPhoneViewer-1.0.0-Windows11-x64.zip out/CiscoPhoneViewer-1.0.0-Windows11-x64.zip.sha256 out/CiscoPhoneViewer-1.0.0-Windows11-x64.zip.sigstore.json out/SECURITY-REVIEW.md out/windows-bundled-selftest.txt
          if ($LASTEXITCODE) { throw 'Release publication failed' }
